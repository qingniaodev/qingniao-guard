name: qingniao-guard
description: >-
  Pre-publish content checks for markdown — URL allowlist, forbidden words with
  context, zh/en pairing. Fails the build when violations are found. Zero
  dependencies. Made by Qingniao (qingniao.dev).
author: Qingniao
branding:
  icon: shield
  color: indigo
inputs:
  path:
    description: Directory to scan (relative to the repository root).
    required: false
    default: "."
  config:
    description: >-
      Path to a guard config JSON (relative to the repository root). When
      omitted, guard looks for guard.config.json in the target directory, then
      the repo root.
    required: false
    default: ""
  checks:
    description: Comma-separated checks to run (domain,secret,pair). Overrides config defaultChecks.
    required: false
    default: ""
  lang:
    description: Output language (en or zh). Machine output is JSON either way.
    required: false
    default: "en"
runs:
  using: composite
  steps:
    - name: Run qingniao-guard
      shell: bash
      run: |
        set -euo pipefail
        ARGS=()
        if [ -n "${{ inputs.config }}" ]; then ARGS+=(--config "${{ inputs.config }}"); fi
        if [ -n "${{ inputs.checks }}" ]; then ARGS+=(--check "${{ inputs.checks }}"); fi
        node "${{ github.action_path }}/cli.js" "${{ inputs.path }}" "${ARGS[@]}" --lang "${{ inputs.lang }}" --json
